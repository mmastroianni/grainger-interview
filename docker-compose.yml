services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: ${DB_USER:-interview}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interview}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
